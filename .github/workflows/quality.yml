name: Kritam quality checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application and tests
        run: python -m compileall -q app tests
